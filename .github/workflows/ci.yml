name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux, fmt, check, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            mesa-vulkan-drivers

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # The historical tree is not rustfmt-clean in every crate, because the
      # GUI, TUI and media work landed from parallel branches. The blocking
      # gate is the files this change touches. The workspace-wide check below
      # keeps the remaining debt visible without blocking an unrelated fix.
      - name: Format changed Rust files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && \
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR \
            "$base" HEAD -- '*.rs')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Rust files changed"
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          rustfmt --check --edition 2024 --config skip_children=true "${files[@]}"

      - name: Workspace format debt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check on the minimum version
        run: cargo check --workspace --locked

  musl:
    name: Headless static musl build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: Build headless binaries
        run: scripts/build-musl.sh

      - name: Verify static binaries
        run: |
          bin=target/x86_64-unknown-linux-musl/release
          file "$bin/ovvc" "$bin/ovvc-daemon" "$bin/ovvc-tui" "$bin/ovvc-server"
          OVVC_DATA_DIR="$RUNNER_TEMP/ovvc-data" "$bin/ovvc" --version

  musl-gui:
    name: Alpine musl GUI build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src rust:1.100.0-alpine sh -c '
            apk add --no-cache bash build-base file &&
            scripts/build-musl-gui.sh &&
            file target/x86_64-unknown-linux-musl/release/ovvc-gui'
