[package]
name = "ovvc-audio"
description = "Opus coding, audio device backends and the voice media engine for ovvc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
ovvc-core = { path = "../ovvc-core" }
ovvc-media = { path = "../ovvc-media" }
serde.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
tokio.workspace = true
clap.workspace = true
# The pure-Rust Opus implementation. There is no C dependency, so the build
# needs neither CMake, pkg-config nor the system libopus.
opus-pure = "0.2.3"

# PipeWire is a Linux-only API. Keeping the dependency out of the dependency
# list on other targets means `--features pipewire` fails at the cfg in lib.rs
# instead of trying to build pipewire-sys (and its pkg-config lookup) there.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", optional = true, features = ["v0_3_49"] }

[features]
# The PipeWire device backend is optional so the workspace builds on machines
# without the PipeWire development headers. Enable it with
# `--features pipewire` after staging the headers with
# `source scripts/audio-dev-env.sh`.
pipewire = ["dep:pipewire"]

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "ovvc-audio-probe"
path = "src/bin/ovvc-audio-probe.rs"
