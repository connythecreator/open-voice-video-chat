[package]
name = "ovvc-cli"
description = "Command-line client for ovvc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "ovvc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
ovvc-client = { path = "../ovvc-client" }
ovvc-config = { path = "../ovvc-config" }
ovvc-control = { path = "../ovvc-control" }
ovvc-core = { path = "../ovvc-core" }
ovvc-ipc = { path = "../ovvc-ipc" }
ovvc-remote = { path = "../ovvc-remote" }
ovvc-theme = { path = "../ovvc-theme" }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
